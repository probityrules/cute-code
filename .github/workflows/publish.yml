# Publish to Visual Studio Marketplace
#
# Auth: GitHub Actions OIDC trusted publishing (no PAT).
#
# One-time setup:
# 1. Create publisher `cute-code` at https://marketplace.visualstudio.com/manage
# 2. Publisher → Trusted publishing → GitHub Actions, with:
#      Organization or user: probityrules
#      Repository:           cute-code
#      Workflow filename:    publish.yml
#      Environment name:     vscode-marketplace
# 3. In GitHub: Settings → Environments → New environment → `vscode-marketplace`
# 4. Bump `version` in package.json (and CHANGELOG), then:
#      git tag v0.3.0 && git push origin v0.3.0
#    Or run this workflow manually (workflow_dispatch).

name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-marketplace
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: vscode-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=cute-code.cute-code
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Publish to Visual Studio Marketplace
        run: npm exec -- vsce publish --oidc --skip-duplicate
